name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ARSHIKA-SINGH
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          # Use PRIVATE_TOKEN (a PAT with 'repo' scope) so private repo
          # contributions are counted too. Falls back to GITHUB_TOKEN
          # (public-only) if you haven't set up the PAT yet.
          token: ${{ secrets.PRIVATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push activity-graph.svg to activity-graph branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
